<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translator</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Bodoni+Moda:wght@400;700&display=swap" rel="stylesheet">


    <style>
        body {
    font-family: 'Bodoni Moda', serif;
    background: url('/static/img.jpg') no-repeat center center fixed;
    background-size: cover;
    text-align: center;
    margin: 0;
    padding: 0;
    color: rgb(17, 9, 9);
}


     
body::before {
    content: "";
    position: fixed;  /* Ensures it covers the entire viewport */
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.5); 
    z-index: -1;
}

        .header {
            background-color: rgba(0, 0, 0, 0.7);
            color: #e7fafc;
            padding: 15px 20px;
            text-align: left;
            font-size: 30px;
            font-weight: bold;
            font-family: 'Great Vibes', cursive;
        }

        /* Container */
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: rgb(255, 255, 255); /* Transparent White */
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgb(0, 0, 0);
            backdrop-filter: blur(8px); /* Blur effect */
        }

        select, textarea, button {
            width: 90%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-family: 'Bodoni Moda', serif;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            font-family: 'Bodoni Moda', serif;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        button {
            background-color: #d9ff8e;
            color: rgb(25, 3, 3);
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.281);
            font-family: 'Bodoni Moda', serif;
        }

        button:hover {
            background-color: #d9ff8e;
        }

        .output {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 5px;
            text-align: left;
            box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.1);
            font-family: 'Bodoni Moda', serif;
            color: black; /* Ensures readability */
        }

        /* Footer */
        .footer {
            margin-top: 50px;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            text-align: center;
            font-family: 'Bodoni Moda', serif;
        }

        .footer a {
            color: #d9ff8e;
            text-decoration: none;
            font-weight: bold;
            margin: 0 10px;
        }

        .footer a:hover {
            color: #45a049;
        }

    </style>
</head>
<body>

    <div class="header">BiLIngual</div>

    <div class="container">
        <h2>Dive into the World of Language 🎓</h2>

        <form method="post">
            <label for="source_lang">From:</label>
            <select name="source_lang">
                {% for lang in languages %}
                    <option value="{{ lang }}">{{ lang }}</option>
                {% endfor %}
            </select>

            <label for="target_lang" style="margin-top: 20px;">To:</label>
            <select name="target_lang">
                {% for lang in languages %}
                    <option value="{{ lang }}">{{ lang }}</option>
                {% endfor %}
            </select>

            <label for="text" style="margin-top: 25px;">Enter Text:</label>
            <textarea name="text" placeholder="Type something..."></textarea>

            <button type="submit">Translate</button>
        </form>

        
        {% if translation %}
        <h3 class="translation-heading">Translation:</h3>
        <div class="output">
            <p>{{ translation }}</p>
        </div>
        {% endif %}
    </div>

    <div class="footer">
        <p>Created by Rohan Bhardwaj |  
            <a href="https://www.linkedin.com/in/rohan-bhardwaj-b92b7a264/" target="_blank"> LinkedIn</a> | 
            <a href="https://x.com/RohanBofficial" target="_blank">Twitter</a>
        </p>
    </div>

</body>
</html>
